[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "linkguard-paper-algorithm"
version = "0.3.0"
description = "Paper-inspired URL features with database-selected external ML/DL adapters"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]
[project.scripts]
linkguard-detect = "detector:main"
linkguard-modelctl = "modelctl:main"
linkguard-explain = "explain_url:main"
[tool.setuptools]
py-modules = ["server", "train", "detector", "modelctl", "explain_url", "pack_joblib"]
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
[tool.setuptools.packages.find]
include = ["linkguard*"]
[tool.setuptools.package-data]
linkguard = ["resources/*.txt", "resources/*.json"]
